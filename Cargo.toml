[package]
name = "role_manager_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
dotenvy = "0.15.7"
google-sheets4 = "6.0.0"
jsonwebtoken = {version = "10.1.0", features = ["rust_crypto"]}
poise = "0.6.1"
reqwest = {version="0.12.24", features = ["json"]}
rusqlite = "0.37.0"
serde = "1.0.228"
serde_json = "1.0.145"
serenity = "0.12.4"
tokio = {version = "1.48.0", features = ["macros", "rt-multi-thread"]}

